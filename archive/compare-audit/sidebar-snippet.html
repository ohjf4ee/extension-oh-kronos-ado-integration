<!-- 1. CSS - paste inside the existing <style>...</style> block. -->
<!-- ============================================================ -->
<style>
    #report-section {
        margin-top: 2em;
        border-top: 2px solid #ccc;
        padding-top: 1em;
    }

    .report-header {
        font-weight: bold;
        font-size: 1.1em;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .compare-audit-btn {
        padding: 8px 16px;
        background-color: #007acc;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
    }

    .compare-audit-btn:hover {
        background-color: #005a9e;
    }

    .compare-audit-btn:disabled {
        background-color: #ccc;
        cursor: not-allowed;
    }

    .report-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        margin-bottom: 20px;
        font-size: 0.85em;
    }

    .report-table th,
    .report-table td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
        vertical-align: top;
    }

    .report-table th {
        background-color: #f5f5f5;
        font-weight: bold;
    }

    .report-table .hours-col {
        text-align: right;
    }

    .report-table th:last-child {
        background-color: #e8f4f8;
        color: #0366d6;
    }

    .report-table td:last-child {
        background-color: #f6f8fa;
        font-style: italic;
    }

    .report-week-header {
        font-weight: bold;
        font-size: 1em;
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        color: #333;
    }

    .report-no-data {
        color: #666;
        font-style: italic;
        margin: 10px 0;
    }

    .report-table a {
        color: #007acc;
        text-decoration: none;
    }

    .report-table a:hover {
        text-decoration: underline;
    }

    .audit-match {
        color: #28a745;
        font-weight: bold;
    }

    .audit-warning {
        color: #ffc107;
        font-weight: bold;
    }

    .audit-error {
        color: #dc3545;
        font-weight: bold;
    }
</style>


<!-- ============================================================================ -->
<!-- 2. MARKUP - paste inside <body>, right after <div id="time-grid"></div>.    -->
<!--    Includes the dashboard-input modal used by compare-audit.js.             -->
<!-- ============================================================================ -->
<div id="report-section">
    <div class="report-header">
        <div><span>Dashboard Comparison &amp; Data Audit</span></div><br>
        <div><button id="compare-audit-btn" class="compare-audit-btn">Compare &amp; Audit</button></div>
    </div>
    <div id="report-output"></div>
</div>

<div id="dashboard-input-modal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width: 800px;">
        <div class="modal-title" style="font-weight:bold;">Paste Dashboard Data</div>
        <div class="modal-body">
            <p style="margin-bottom: 15px;">Please follow these steps to get your dashboard data:</p>
            <ol style="margin-bottom: 15px;">
                <li>Go to your Planview dashboard page (Tara's Team Dashboard)</li>
                <li>Press <strong>Ctrl+A</strong> to select all content</li>
                <li>Press <strong>Ctrl+C</strong> to copy</li>
                <li>Paste the content in the text area below (<strong>Ctrl+V</strong>)</li>
            </ol>
            <textarea id="dashboard-data-input"
                      placeholder="Paste your dashboard data here..."
                      style="width: 100%; height: 300px; font-family: monospace; font-size: 12px; margin-bottom: 15px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </textarea>
            <div style="text-align: right;">
                <button id="dashboard-cancel-btn" style="margin-right: 10px; padding: 8px 16px; background: #ccc; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
                <button id="dashboard-ok-btn" style="padding: 8px 16px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer;">Process Data</button>
            </div>
        </div>
    </div>
</div>
